*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#080D18;overflow:hidden}
.bg{position:fixed;inset:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42}
.b1{width:62vmax;height:62vmax;left:-18vmax;top:-24vmax;background:radial-gradient(circle,#3DDC97 0,transparent 66%);animation:d1 17s ease-in-out infinite alternate}
.b2{width:56vmax;height:56vmax;right:-20vmax;bottom:-24vmax;background:radial-gradient(circle,#9875FF 0,transparent 66%);animation:d2 21s ease-in-out infinite alternate}
.b3{width:40vmax;height:40vmax;right:8vmax;top:-14vmax;background:radial-gradient(circle,#48E3EF 0,transparent 66%);animation:d3 14s ease-in-out infinite alternate;opacity:.28}
@keyframes d1{to{transform:translate(20vmax,14vmax) scale(1.2)}}
@keyframes d2{to{transform:translate(-16vmax,-12vmax) scale(1.15)}}
@keyframes d3{to{transform:translate(-14vmax,18vmax) scale(.85)}}
main{position:fixed;inset:0;display:grid;place-items:center}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)}
#bloom{position:fixed;left:50%;top:44%;width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;border-radius:50%;background:radial-gradient(circle,rgba(61,220,151,.38) 0,rgba(72,227,239,.12) 40%,transparent 68%);filter:blur(10px);will-change:transform,opacity}
#wrap{position:relative;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
#box{position:relative;will-change:transform}
#logo{width:min(380px,78vw);height:auto;overflow:visible;display:block}
#cs{position:absolute;left:50%;bottom:6%;width:56%;height:22px;margin-left:-28%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(7px);transform-origin:50% 50%;will-change:transform,opacity}
#word{display:flex;margin-top:6px;font:600 clamp(64px,16vw,104px)/1.05 'SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;letter-spacing:-.045em}
#word span{display:inline-block;will-change:transform,opacity,filter;background:linear-gradient(180deg,#FFFFFF 18%,#9FB0CC 130%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#fx{position:fixed;inset:0;z-index:3;pointer-events:none}
</style>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div id="bloom"></div>
<main>
<div id="wrap">
<div id="box">
<svg id="logo" viewBox="-40 -40 280 280" role="img" aria-label="Logo Travi">
<defs>
<clipPath id="tc"><rect x="3" y="3" width="188" height="188" rx="44"/></clipPath>
<clipPath id="cc"><circle cx="96" cy="100" r="62"/></clipPath>
<radialGradient id="gg"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect class="shadow" x="8" y="8" width="192" height="192" rx="46" fill="#111111"/>
<rect class="tile" x="3" y="3" width="188" height="188" rx="44" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
<g transform="translate(0,-3)">
<circle class="ring" cx="96" cy="100" r="62" fill="none" stroke="#3DDC97" stroke-width="3" opacity="0"/>
<circle class="ring" cx="96" cy="100" r="62" fill="none" stroke="#3DDC97" stroke-width="3" opacity="0"/>
<circle class="disc" cx="96" cy="100" r="62" fill="#3DDC97"/>
<g clip-path="url(#cc)" fill="none" stroke="#111111" stroke-linecap="round">
<path class="arc" pathLength="1" stroke-dasharray="1 1" d="M40,112 C62,134 92,128 98,110" stroke-width="8"/>
<path class="arc" pathLength="1" stroke-dasharray="1 1" d="M46,128 C68,146 100,140 110,122" stroke-width="6"/>
<path class="arc" pathLength="1" stroke-dasharray="1 1" d="M56,142 C76,154 104,150 116,136" stroke-width="4"/>
</g>
<g transform="translate(-6,-2)">
<g class="leaf">
<path d="M30,78 C28,42 54,24 82,28 C84,58 62,84 30,78 Z" fill="#48E3EF" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
<path d="M34,76 C48,60 62,46 76,34" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
</g>
</g>
<g class="fly">
<g transform="translate(118,76) rotate(45) scale(0.9)">
<path d="M0,-50 C4,-50 6,-40 6,-30 L6,-12 L46,14 L46,24 L6,12 L6,30 L16,40 L16,46 L0,41 L-16,46 L-16,40 L-6,30 L-6,12 L-46,24 L-46,14 L-6,-12 L-6,-30 C-6,-40 -4,-50 0,-50 Z" fill="#FFFFFF" stroke="#111111" stroke-width="5.5" stroke-linejoin="round"/>
</g>
</g>
</g>
<g clip-path="url(#tc)"><circle class="glare" cx="97" cy="40" r="120" fill="url(#gg)" opacity="0"/><rect class="shine" x="-70" y="-10" width="46" height="220" fill="url(#sg)" opacity="0"/></g>
</svg>
<div id="cs"></div>
</div>
<div id="word" aria-hidden="true"><span>T</span><span>r</span><span>a</span><span>v</span><span>i</span></div>
</div>
</main>
<canvas id="fx"></canvas>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var clamp=function(x,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return x<a?a:x>b?b:x};
var seg=function(t,s,d){return clamp((t-s)/d)};
var eOut=function(u){return 1-Math.pow(1-u,3)};
var eBack=function(u){var a=1.70158,c=a+1,m=u-1;return 1+c*m*m*m+a*m*m};
var eSp=function(u){return u<=0?0:u>=1?1:1-Math.exp(-7.5*u)*Math.cos(11*u)};
var eIO=function(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
var bez=function(u,a,b,c,d){var m=1-u;return m*m*m*a+3*m*m*u*b+3*m*u*u*c+u*u*u*d};
var dbez=function(u,a,b,c,d){var m=1-u;return 3*m*m*(b-a)+6*m*u*(c-b)+3*u*u*(d-c)};

var svg=$('logo'),wrap=$('wrap');
var L={tile:svg.querySelector('.tile'),shadow:svg.querySelector('.shadow'),disc:svg.querySelector('.disc'),
  arcs:[].slice.call(svg.querySelectorAll('.arc')),leaf:svg.querySelector('.leaf'),plane:svg.querySelector('.fly'),
  rings:[].slice.call(svg.querySelectorAll('.ring')),shine:svg.querySelector('.shine'),glare:svg.querySelector('.glare')};
var G=[];(function(){var par=L.plane.parentNode;for(var i=0;i<3;i++){var c=L.plane.cloneNode(true);c.setAttribute('class','ghost');c.setAttribute('opacity',0);par.insertBefore(c,L.plane);G.push(c)}})();
var box=$('box'),cs=$('cs'),bloom=$('bloom');
var spans=[].slice.call(document.querySelectorAll('#word span'));
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function T(el,cx,cy,s,r,tx,ty){el.setAttribute('transform','translate('+(cx+tx)+' '+(cy+ty)+') rotate('+r+') scale('+s+') translate('+(-cx)+' '+(-cy)+')')}

function flyIn(u){
  var p=eOut(u),X=[-170,-85,-28,0],Y=[150,178,76,0];
  var ang=Math.atan2(dbez(p,Y[0],Y[1],Y[2],Y[3]),dbez(p,X[0],X[1],X[2],X[3]))*57.2958;
  var k=1-eIO(clamp((u-.6)/.4));
  return {px:bez(p,X[0],X[1],X[2],X[3]),py:bez(p,Y[0],Y[1],Y[2],Y[3]),pr:(ang+45)*k,ps:1,po:clamp(u*10)};
}
function flyOut(o){
  var e=o*o*(.6+1.4*o);
  return {px:e*300,py:-e*300,pr:0,ps:1+o*.5,po:1-clamp((o-.7)/.3)};
}
function pose(t){
  var P={tile:1,disc:1,arcs:[1,1,1],leaf:1,px:0,py:0,pr:0,ps:1,po:1,idle:1,ring:1,shine:-100,shO:0,sx:0,sy:0};
  P.tile=eSp(seg(t,0,.8));
  P.disc=eSp(seg(t,.45,.8));
  P.arcs=[0,1,2].map(function(i){return eOut(seg(t,1.0+i*.12,.55))});
  P.leaf=eSp(seg(t,1.4,.7));
  P.ring=seg(t,.6,.5);
  P.idle=eIO(seg(t,2.3,.9));
  if(t<2.5){var f=flyIn(seg(t,1.55,.95));for(var k in f)P[k]=f[k];}
  var o=seg(t,7.6,.8);
  if(o>0){var g=flyOut(o);for(var k2 in g)P[k2]=g[k2];}
  var s=[seg(t,2.9,.6),seg(t,6.0,.6)];
  for(var i=0;i<2;i++){if(s[i]>0&&s[i]<1){var e=eIO(s[i]);P.shine=-80+e*330;P.shO=Math.sin(s[i]*Math.PI)}}
  P.sx=-Math.sin(t*.9)*2.5;P.sy=-Math.cos(t*.7)*2;
  return P;
}
function apply(P,ti){
  var a=P.idle;
  L.tile.setAttribute('opacity',P.tile>.001?1:0);T(L.tile,97,97,Math.max(P.tile,.001),0,0,0);
  L.shadow.setAttribute('opacity',P.tile>.3?1:0);T(L.shadow,104,104,Math.max(P.tile,.001),0,P.sx,P.sy);
  var ds=P.disc*(1+a*.012*Math.sin(ti*2));
  L.disc.setAttribute('opacity',P.disc>.001?1:0);T(L.disc,96,100,Math.max(ds,.001),0,0,0);
  for(var i=0;i<3;i++){
    var p=P.arcs[i],el=L.arcs[i];
    el.setAttribute('stroke-dashoffset',(1-p).toFixed(4));
    el.setAttribute('opacity',p>.01?1:0);
    T(el,96,100,1,0,a*Math.sin(ti*2.2+i*.9)*2.4,a*Math.cos(ti*2+i)*.8);
  }
  L.leaf.setAttribute('opacity',P.leaf>.001?1:0);
  T(L.leaf,30,78,Math.max(P.leaf,.001),a*Math.sin(ti*1.7)*5,0,0);
  L.plane.setAttribute('opacity',P.po);
  T(L.plane,118,76,P.ps,P.pr+a*Math.sin(ti*1.3)*3,P.px+a*Math.sin(ti*1.6)*2,P.py+a*Math.cos(ti*1.3)*3);
  for(var k=0;k<2;k++){
    var ph=((ti*.45)+k*.5)%1;
    L.rings[k].setAttribute('r',(62+ph*62).toFixed(2));
    L.rings[k].setAttribute('opacity',(P.ring*(1-ph)*.6).toFixed(3));
    L.rings[k].setAttribute('stroke-width',(3*(1-ph)+.6).toFixed(2));
  }
  L.shine.setAttribute('opacity',P.shO);
  L.shine.setAttribute('transform','translate('+P.shine+' 0) skewX(-20)');
}

var cv=$('fx'),cx=cv.getContext('2d'),W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',fit);fit();
var COL=['#3DDC97','#48E3EF','#FFFFFF','#9875FF'];
var pts=[],dust=[];
function spark(x,y,vx,vy,life,size,col,type){pts.push({x:x,y:y,vx:vx,vy:vy,l:life,m:life,s:size,c:col,t:type||0})}
function burst(x,y,n,sp,size){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=sp*(.35+Math.random()*.65);spark(x,y,Math.cos(a)*v,Math.sin(a)*v,.5+Math.random()*.6,size*(.5+Math.random()),COL[(Math.random()*4)|0],0)}}
for(var d=0;d<46;d++)dust.push({x:Math.random(),y:Math.random(),v:6+Math.random()*16,ph:Math.random()*6.28,s:.8+Math.random()*1.8,c:COL[(Math.random()*4)|0]});
for(var d2=0;d2<14;d2++)dust.push({x:Math.random(),y:Math.random(),v:4+Math.random()*7,ph:Math.random()*6.28,s:9+Math.random()*20,c:COL[(Math.random()*2)|0],b:1});
function step(dt){
  for(var i=pts.length-1;i>=0;i--){var p=pts[i];p.l-=dt;if(p.l<=0){pts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t===0){var f=1-1.5*dt;p.vx*=f;p.vy*=f}}
  for(var j=0;j<dust.length;j++){var q=dust[j];q.y-=q.v*dt/H;if(q.y<-.02){q.y=1.02;q.x=Math.random()}}
}
function draw(t){
  cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
  for(var j=0;j<dust.length;j++){var q=dust[j];cx.globalAlpha=q.b?.045+.035*Math.sin(t*.8+q.ph):.18+.22*Math.sin(t*1.4+q.ph);cx.fillStyle=q.c;cx.beginPath();cx.arc(q.x*W,q.y*H,q.s,0,6.283);cx.fill()}
  for(var i=0;i<pts.length;i++){var p=pts[i],a=p.l/p.m;
    if(p.t===1){cx.globalAlpha=a*.8;cx.strokeStyle=p.c;cx.lineWidth=p.s;cx.lineCap='round';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*.09,p.y-p.vy*.09);cx.stroke()}
    else{cx.fillStyle=p.c;cx.globalAlpha=a*.28;cx.beginPath();cx.arc(p.x,p.y,p.s*a*2.4+.5,0,6.283);cx.fill();cx.globalAlpha=a;cx.beginPath();cx.arc(p.x,p.y,p.s*a+.4,0,6.283);cx.fill()}}
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
}
function pxOf(vx,vy){var R=svg.getBoundingClientRect(),k=R.width/280;return [R.left+(vx+40)*k,R.top+(vy+40)*k,k]}

var END=9,t0=null,last=null,cyc=-1,ev={},acc=0;
function render(t,dt){
  var P=pose(t);apply(P,t);
  var fl=(t>1.55&&t<2.7)||(t>7.6&&t<8.6),wo=[.3,.17,.09];
  for(var g=0;g<3;g++){var Q=pose(Math.max(0,t-(g+1)*.05));
    G[g].setAttribute('opacity',fl?(Q.po*wo[g]).toFixed(3):0);
    T(G[g],118,76,Q.ps,Q.pr,Q.px,Q.py)}
  var e=eIO(seg(t,8.3,.7));
  L.glare.setAttribute('cx',(97-Math.sin(t*.9)*70).toFixed(1));
  L.glare.setAttribute('cy',(44-Math.cos(t*.7)*34).toFixed(1));
  L.glare.setAttribute('opacity',P.tile>.95?seg(t,2.2,.8):0);
  var fy=Math.sin(t*1.1)*9*P.idle;
  box.style.transform='translateY('+(-fy).toFixed(2)+'px)';
  cs.style.transform='scale('+(1+fy*.012).toFixed(3)+')';
  cs.style.opacity=Math.max(0,Math.min(1,P.tile))*(.8-fy*.02);
  bloom.style.opacity=((.55+.25*Math.sin(t*1.8))*seg(t,.3,.9)*(1-e)).toFixed(3);
  bloom.style.transform='scale('+(1+.06*Math.sin(t*1.8)).toFixed(3)+')';
  if(reduce){wrap.style.transform='none'}
  else wrap.style.transform='perspective(900px) rotateY('+(Math.sin(t*.9)*7)+'deg) rotateX('+(Math.cos(t*.7)*5)+'deg) scale('+((1+.035*Math.sin(Math.PI*t/END))*(1-.06*e))+')';
  wrap.style.opacity=1-e;
  for(var i=0;i<spans.length;i++){var u=eOut(seg(t,2.2+i*.06,.75));
    spans[i].style.opacity=u;
    spans[i].style.transform='translateY('+((1-u)*30)+'px) scale('+(.9+.1*u)+')';
    spans[i].style.filter=u<1?'blur('+((1-u)*12).toFixed(1)+'px)':'none'}
  if(reduce||dt===0)return;
  var tl=pxOf(92+P.px,96+P.py),k=tl[2];
  if(t>.5&&!ev.a){ev.a=1;var c=pxOf(96,97);burst(c[0],c[1],28,380*k,3.2)}
  if(t>2.5&&!ev.b){ev.b=1;burst(tl[0]+20*k,tl[1]-20*k,18,300*k,2.6)}
  if(t>7.62&&!ev.c){ev.c=1;burst(tl[0],tl[1],22,420*k,2.6)}
  var flight=(t>1.55&&t<2.5)||(t>7.6&&t<8.4);
  var rate=flight?150:26*P.idle;
  if(P.po>.3){
    acc+=rate*dt;
    while(acc>=1){acc-=1;
      var j=(Math.random()-.5)*8*k;
      spark(tl[0]+j,tl[1]+j,-(20+Math.random()*44)*k,(14+Math.random()*34)*k,.6+Math.random()*.6,(1.6+Math.random()*2.8)*k,COL[(Math.random()*3)|0],0);
      if(t>7.6&&t<8.4&&Math.random()<.7)spark(tl[0]+(Math.random()-.5)*30*k,tl[1]+(Math.random()-.5)*30*k,-300*k,300*k,.3,1.4+Math.random()*1.6,COL[(Math.random()*3)|0],1);
    }
  }
}

function frame(now){
  if(t0===null){t0=now;last=now}
  var dt=Math.min(.05,(now-last)/1000);last=now;
  var el=(now-t0)/1000,c=Math.floor(el/END),t=el-c*END;
  if(c!==cyc){cyc=c;ev={};acc=0}
  render(t,dt);
  step(dt);draw(el);
  window.requestAnimationFrame(frame);
}
if(reduce){render(4.5,0)}else window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
